name: Stage npm Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@ivanduplenskikh'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node --input-type=module -e
          "import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== 'v' + manifest.version)
          throw new Error('Release tag must match the package version');"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Stage npm release for approval
        run: npm stage publish --provenance --access public